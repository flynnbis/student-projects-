            }

            nav {

            }

                font-family: "Rockwell";

            }

        <h1>Quiz</h1>
        <h2>May the four choice be with you</h2>
        <br>
        <h2>Hempcrete is bio-composite of what?</h2>
        <div class = "container">
            <button onclick = "reveal1()">A. Sand and Cement</button>
            <button onclick = "reveal1()">B. Plastic and Resin</button>
            <button onclick = "reveal1()">C. Inner core of hemp plant and lime based binder</button>
            <button onclick = "reveal1()">D. Wood Chips and Clay</button>
            <br>
            <h2 id = "answer1" style="display:none;">It was C!</h2>
        </div>
        <br>
        <h2>Why is mycelium useful for making composites?</h2>
        <div class = "container">
            <button onclick = "reveal2()">A. It melts materials</button>
            <button onclick = "reveal2()">B. It acts like glue</button>
            <button onclick = "reveal2()">C. It melts metal fibres</button>
            <button onclick = "reveal2()">D. It needs heavy machines</button>
            <br>
            <h2 id = "answer2" style="display:none;">It was B!</h2>
        </div>
        <br>
        <h2>What gives traditional wood its brown color?</h2>
        <div class = "container">
            <button onclick = "reveal3()">A. Transparent Polymer</button>
            <button onclick = "reveal3()">B. Light absorption and scattering</button>
            <button onclick = "reveal3()">C. Air spaces in the wood</button>
            <button onclick = "reveal3()">D. Lignin Insertion</button>
            <br>
            <h2 id = "answer3" style="display:none;">It was B!</h2>
        </div>
